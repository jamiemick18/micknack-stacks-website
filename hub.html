<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Micknack Stacks HUB</title>

<!-- Added to a phone's home screen, this is what it looks like. -->
<link rel="manifest" href="hub.webmanifest" />
<meta name="theme-color" content="#0f0d0b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="HUB" />
<link rel="apple-touch-icon" href="assets/emblem-bear-moon.png" />
<link rel="icon" href="assets/micknack-bear.ico" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" />

<style>
  :root {
    --ink: #0f0d0b; --paper: #faf6ef; --card: #fffaf4;
    --gold: #b78436; --line: rgba(15,13,11,.14); --muted: #6b6259; --bad: #9a3412;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.5 "Jost", -apple-system, "Helvetica Neue", Arial, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  button, input { font: inherit; }

  /* ---- the gate ---- */
  #gate {
    min-height: 100dvh; display: grid; place-items: center; padding: 24px;
  }
  #gate .inner { width: 100%; max-width: 340px; text-align: center; }
  #gate img { width: 92px; height: auto; margin-bottom: 18px; }
  #gate h1 {
    font: 500 1.05rem/1 "Cormorant Garamond", Georgia, serif;
    letter-spacing: .22em; text-transform: uppercase; margin: 0 0 26px;
  }
  #gate input {
    width: 100%; padding: 15px 16px; border: 1px solid var(--line);
    border-radius: 3px; background: #fff; margin-bottom: 12px; text-align: center;
  }
  #gate button {
    width: 100%; padding: 15px; border: 0; border-radius: 999px;
    background: var(--ink); color: var(--paper); letter-spacing: .14em;
    text-transform: uppercase; font-size: .8rem;
  }
  #gate .msg { color: var(--bad); font-size: .85rem; min-height: 22px; margin: 12px 0 0; }

  /* ---- chrome ---- */
  #app { display: none; }
  header {
    position: sticky; top: 0; z-index: 9; background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: calc(12px + env(safe-area-inset-top)) 16px 0;
  }
  .top { display: flex; align-items: center; gap: 10px; }
  .top h1 {
    font: 500 .92rem/1 "Cormorant Garamond", Georgia, serif;
    letter-spacing: .2em; text-transform: uppercase; margin: 0; flex: 1;
  }
  .top img { width: 24px; height: 24px; border-radius: 3px; }
  .top .out { background: none; border: 0; color: var(--muted); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; padding: 6px; }
  nav { display: flex; gap: 2px; margin-top: 10px; overflow-x: auto; }
  nav button {
    background: none; border: 0; border-bottom: 2px solid transparent;
    color: var(--muted); font-size: .72rem; letter-spacing: .13em;
    text-transform: uppercase; padding: 10px 12px; white-space: nowrap;
  }
  nav button.on { color: var(--ink); border-bottom-color: var(--gold); }
  nav .dot {
    display: inline-block; min-width: 17px; margin-left: 5px; padding: 1px 5px;
    background: var(--gold); color: #fff; border-radius: 999px; font-size: .64rem;
  }

  main { padding: 14px 16px 40px; }
  .view { display: none; }
  .view.on { display: block; }
  .note { color: var(--muted); font-size: .85rem; margin: 0 0 12px; }
  .note.bad { color: var(--bad); }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 14px 15px; }
  .tile .n { font: 500 1.6rem/1 "Cormorant Garamond", Georgia, serif; display: block; }
  .tile .k { font-size: .64rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .tile.warn { border-color: var(--gold); } .tile.warn .n { color: var(--gold); }

  h2 {
    font-size: .68rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); font-weight: 400; margin: 22px 0 10px;
  }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 4px; padding: 14px 15px; margin-bottom: 10px;
  }
  .card.late { border-left: 3px solid var(--gold); }
  .card.live { border-left: 3px solid var(--gold); }
  .rowtop { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .when { color: var(--muted); font-size: .72rem; white-space: nowrap; }
  .where { color: var(--muted); font-size: .78rem; margin-top: 2px; }
  ul.items { margin: 10px 0 0; padding-left: 18px; font-size: .88rem; }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .foot a { color: var(--gold); font-size: .78rem; text-decoration: none; }

  .act {
    border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
    border-radius: 999px; padding: 9px 16px; font-size: .76rem;
    letter-spacing: .1em; text-transform: uppercase;
  }
  .act.ghost { background: none; color: var(--ink); }
  .act.danger { background: none; border-color: var(--bad); color: var(--bad); }
  .act:disabled { opacity: .4; }

  /* ---- stock ---- */
  #find {
    width: 100%; padding: 13px 15px; border: 1px solid var(--line);
    border-radius: 999px; background: #fff; margin-bottom: 12px;
  }
  .piece { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .piece.off { opacity: .5; }
  .piece .name { flex: 1; font-size: .9rem; line-height: 1.3; }
  .piece .sub { color: var(--muted); font-size: .72rem; }
  .stepper { display: flex; align-items: center; gap: 0; }
  .stepper button {
    width: 40px; height: 40px; border: 1px solid var(--line); background: #fff;
    font-size: 1.1rem; color: var(--ink);
  }
  .stepper button:first-child { border-radius: 3px 0 0 3px; }
  .stepper button:last-child { border-radius: 0 3px 3px 0; }
  .stepper .q {
    width: 46px; height: 40px; display: grid; place-items: center;
    border: 1px solid var(--line); border-left: 0; border-right: 0;
    background: #fff; font-variant-numeric: tabular-nums;
  }
  .piece .eye { background: none; border: 0; color: var(--muted); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; padding: 8px 2px 8px 8px; }

  .stars { color: var(--gold); letter-spacing: .14em; font-size: .8rem; }
  blockquote { margin: 8px 0; font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.05rem; line-height: 1.5; }
  .meta { color: var(--muted); font-size: .74rem; }

  .money-row { display: flex; justify-content: space-between; font-size: .88rem; padding: 5px 0; }
  .money-row span:last-child { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<section id="gate">
  <div class="inner">
    <img src="assets/emblem-bear-moon.png" alt="" />
    <h1>Micknack Stacks</h1>
    <form id="gate-form">
      <input type="password" id="pass" placeholder="Password" autocomplete="current-password"
             autocapitalize="off" autocorrect="off" spellcheck="false" />
      <button type="submit">Open the HUB</button>
    </form>
    <p class="msg" id="gate-msg"></p>
  </div>
</section>

<div id="app">
  <header>
    <div class="top">
      <img src="assets/emblem-bear-moon.png" alt="" />
      <h1>HUB</h1>
      <button class="out" id="lock">Lock</button>
    </div>
    <nav>
      <button data-view="today" class="on">Today</button>
      <button data-view="orders">To send <span class="dot" id="dot-orders" hidden>0</span></button>
      <button data-view="stock">Stock</button>
      <button data-view="requests">Requests <span class="dot" id="dot-requests" hidden>0</span></button>
      <button data-view="reviews">Reviews <span class="dot" id="dot-reviews" hidden>0</span></button>
    </nav>
  </header>

  <main>
    <p class="note" id="note"></p>
    <section class="view on" id="v-today"></section>
    <section class="view" id="v-orders"></section>
    <section class="view" id="v-stock">
      <input type="search" id="find" placeholder="Find a piece…" />
      <div id="stock-list"></div>
    </section>
    <section class="view" id="v-requests"></section>
    <section class="view" id="v-reviews"></section>
  </main>
</div>

<script src="js/hub-phone.js?v=20261027b"></script>
</body>
</html>
