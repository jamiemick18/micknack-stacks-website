name: Sync Etsy listings

on:
  schedule:
    # Runs once a day at 13:00 UTC (~9am Eastern / 6am Pacific).
    # Change the cron expression to adjust — https://crontab.guru helps.
    - cron: "0 13 * * *"
  workflow_dispatch: {} # lets you click "Run workflow" in the Actions tab anytime

permissions:
  contents: write
  pages: write
  id-token: write

# Queue overlapping syncs (e.g. the daily schedule and a manual run) instead of
# letting them race to commit data/products.js on top of each other.
concurrency:
  group: sync-etsy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Start from the current tip of main, not the commit the run was created
      # on, so the sync always uses the latest script and the latest listings.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest Etsy listings
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHOP_NAME: ${{ vars.ETSY_SHOP_NAME }}
          # Lets the sync read option drop-downs. Without it the sync still
          # runs and simply leaves data/variations.js alone.
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: node scripts/sync-etsy.js

      # Etsy sales move the shop's own stock. Sent as changes, not totals, so a
      # sale made on the site isn't undone by Etsy's older count.
      #
      # The worker is called on every run, even with nothing to send, because a
      # run that quietly skips looks exactly like one where the secrets are
      # missing. An empty set of changes writes nothing and still answers.
      - name: Send Etsy stock changes to the checkout worker
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
        run: |
          if [ -z "$WORKER_ADMIN_TOKEN" ] || [ -z "$WORKER_URL" ]; then
            echo "::warning::WORKER_URL or WORKER_ADMIN_TOKEN is not set, so the shop's stock was left alone."
            exit 0
          fi

          if [ -f data/etsy-stock-deltas.json ]; then
            node -e 'const d=require("./data/etsy-stock-deltas.json");console.log(JSON.stringify({deltas:d.deltas||{}}))' > /tmp/deltas.json
          else
            echo '{"deltas":{}}' > /tmp/deltas.json
          fi

          changes=$(node -e 'console.log(Object.keys(require("/tmp/deltas.json").deltas).length)')
          echo "Etsy stock changes to send: $changes"

          code=$(curl -sS -o /tmp/worker-reply.json -w '%{http_code}' \
            -X POST "$WORKER_URL/admin" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Token: $WORKER_ADMIN_TOKEN" \
            -d @/tmp/deltas.json)
          echo "Worker replied $code: $(cat /tmp/worker-reply.json)"

          if [ "$code" != "200" ]; then
            echo "::error::The checkout worker refused the stock update."
            exit 1
          fi
          echo "Stock link to the checkout worker is healthy."

      - name: Commit and push if listings changed
        run: |
          git config user.name "micknack-stacks-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/products.js data/etsy-stock-deltas.json data/variations.js; then
            echo "No listing changes — nothing to commit."
          else
            git add data/products.js data/etsy-stock-deltas.json data/variations.js
            git commit -m "Sync Etsy listings"
            # Rebase onto anything pushed while this run was in flight, so a
            # concurrent commit doesn't fail the sync.
            # products.js is fully regenerated from Etsy on every run, so if it
            # conflicts with a newer commit, this run's fresh copy wins.
            git pull --rebase -X theirs origin main
            git push
          fi

  # The sync job's push uses GITHUB_TOKEN, which by design does not trigger
  # other workflows — so publish explicitly here instead of hoping the push
  # trigger fires.
  publish:
    needs: sync
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
